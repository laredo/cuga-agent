      method: POST
      json:
        channel: C0AKGGHQ74M
        text: "{tavern.env_vars.SLACK_BOT_MENTION} say the word BETA"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "(?i)beta"

---
test_name: Concurrent requests - responses are independent (HTTP)

marks:
  - slack
  - concurrency
  - http
  - slow

stages:
  - name: Start thread 1 with a calculation
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} what is 111 + 222?"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "333"
      save:
        json:
          thread_ts_1: sent.ts

  - name: Start thread 2 with a different calculation
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} what is 444 + 555?"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "999"
      save:
        json:
          thread_ts_2: sent.ts

  - name: Continue thread 1 independently
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} and what is 10 + 10?"
        thread_ts: "{thread_ts_1}"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "20"

  - name: Continue thread 2 independently
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} and what is 20 + 20?"
        thread_ts: "{thread_ts_2}"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "40"

---
test_name: Thread isolation - separate conversations (HTTP)

marks:
  - slack
  - concurrency
  - http
  - isolation
  - slow

stages:
  - name: Start conversation A about animals
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} let's talk about dogs"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !anystr
      save:
        json:
          conversation_a: sent.ts

  - name: Start conversation B about food
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} let's talk about pizza"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !anystr
      save:
        json:
          conversation_b: sent.ts

  - name: Continue conversation A - should stay on dogs
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} what are we talking about?"
        thread_ts: "{conversation_a}"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "(?i)dog"

  - name: Continue conversation B - should stay on pizza
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} what are we talking about?"
        thread_ts: "{conversation_b}"
        timeout: 45
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "(?i)pizza"

