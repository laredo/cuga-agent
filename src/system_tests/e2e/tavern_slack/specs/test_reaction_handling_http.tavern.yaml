---
test_name: Unrecognized reaction produces no bot response (HTTP)

marks:
  - slack
  - reactions

stages:
  - name: Post a message to react to with an unknown emoji
    request:
      url: http://localhost:5555/slack/send
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "Reaction test message — react with eyes emoji (should be ignored)"
    response:
      status_code: 200
      strict: false
      json:
        ts: !anystr
      save:
        json:
          noop_msg_ts: ts

  - name: React with eyes and expect timeout (no bot response)
    request:
      url: http://localhost:5555/slack/react_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        message_ts: "{noop_msg_ts}"
        reaction: "eyes"
        timeout: 10
    response:
      status_code: 408
      strict: false
      json:
        error: !anystr
