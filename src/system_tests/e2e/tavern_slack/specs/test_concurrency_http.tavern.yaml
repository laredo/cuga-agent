---
test_name: Bot handles rapid sequential messages (HTTP)

marks:
  - slack
  - concurrency

stages:
  - name: Send first rapid message
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} what is 10 + 10?"
        timeout: 30
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "20"

  - name: Send second rapid message
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} what is 20 + 20?"
        timeout: 30
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "40"

  - name: Send third rapid message
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: "{tavern.env_vars.SLACK_TEST_CHANNEL}"
        text: "{tavern.env_vars.SLACK_BOT_MENTION} what is 5 * 5?"
        timeout: 30
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "25"

---
test_name: Bot responds correctly in multiple channels sequentially (HTTP)

marks:
  - slack
  - concurrency
  - multi_channel

stages:
  - name: Send to channel 1
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: C0AKFDWC9JS
        text: "{tavern.env_vars.SLACK_BOT_MENTION} say the word ALPHA"
        timeout: 30
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "(?i)alpha"

  - name: Send to channel 2
    request:
      url: http://localhost:5555/slack/send_and_wait
      method: POST
      json:
        channel: C0AKGGHQ74M
        text: "{tavern.env_vars.SLACK_BOT_MENTION} say the word BETA"
        timeout: 30
    response:
      status_code: 200
      strict: false
      json:
        response:
          text: !re_search "(?i)beta"

