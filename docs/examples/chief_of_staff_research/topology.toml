# Chief of Staff Research — Swarm Topology
#
# Pattern: swarm  (async, fire-and-forget background tasks)
#
# Each agent runs as a concurrent asyncio.Task with its own inbox queue.
# Agents embed directives in their plain-text output:
#
#   DISPATCH:<agent_id>
#   <content to route to that agent's inbox>
#
#   NOTIFY_SLACK:<text to post to the Slack thread>
#
# SwarmBus ACL (from peers fields):
#   sender may only DISPATCH to agents in its own peers list.
#   Any agent may DISPATCH to the entry agent (chief_of_staff).
#
# Lifecycle:
#   chief_of_staff runs once per Slack message and returns an immediate ack.
#   Workers (web_searcher, fact_checker, summarizer) fire-and-forget in the
#   background, posting NOTIFY_SLACK: updates as they go.  No feedback loop
#   back to chief_of_staff is needed.
#
# Document provenance convention (KB title prefixes):
#   web_searcher::<title>   raw collected document (unvetted)
#   fact_checker::<title>   validated, scored document
#
# Scoring scale: 1–5
#   5  Peer-reviewed or highly authoritative; claims fully verified
#   4  Reputable source; claims mostly verified
#   3  Credible; limited verification or minor inaccuracies  ← minimum kept
#   2  Questionable source or significant unverified claims  ← discarded
#   1  Unreliable source or factually incorrect              ← discarded
#
# Two modes (both triggered from Slack):
#
#   RESEARCH MODE  "@bot research <topic>"
#     chief_of_staff → ack immediately → DISPATCH:web_searcher
#     web_searcher searches, stores each doc, NOTIFY_SLACK: progress, DISPATCH:fact_checker per doc
#     fact_checker validates each doc, NOTIFY_SLACK: result
#
#   SUMMARY MODE   "@bot summarize <aspect>"
#     chief_of_staff → ack immediately → DISPATCH:summarizer
#     summarizer reads KB (fact_checker:: only), NOTIFY_SLACK: full report
#
# Activate:
#   cd docs/examples/chief_of_staff_research
#   cp .env.example .env && vim .env
#   python run.py

[configuration]
name    = "chief_of_staff_research"
pattern = "swarm"

# ---------------------------------------------------------------------------
# Chief of Staff — entry agent
# Runs ONCE per Slack message; its text output is the immediate Slack ack.
# ---------------------------------------------------------------------------

[[agents]]
id     = "chief_of_staff"
type   = "cuga_lite"
role   = "entry"
domain = "research_orchestration"
peers  = ["web_searcher", "summarizer"]
timeout_seconds = 60
instructions = """
You are a Chief of Staff managing a research team.  You receive Slack messages
and must respond IMMEDIATELY with a short acknowledgement, then dispatch the
work to your team in the background.

Your output MUST follow this structure (plain text first, then DISPATCH blocks):

── RESEARCH MODE ─────────────────────────────────────────────────────────────
Triggered by: "research <topic>", "look into <topic>", "find info on <topic>"

Output:
🔍 Starting research on *<topic>*. My team is on it — I'll post updates here as documents are found and vetted.

DISPATCH:web_searcher
Search for 5–8 recent, authoritative documents on: <topic>.
For each document found:
  1. Store it in the Knowledge Base as "web_searcher::<title>".
  2. Post a NOTIFY_SLACK: update with the document title and source.
  3. DISPATCH it to fact_checker for validation.
After all documents are dispatched, post a NOTIFY_SLACK: completion summary.

── SUMMARY MODE ──────────────────────────────────────────────────────────────
Triggered by: "summarize <aspect>", "write up <aspect>", "what do we know about <aspect>"

Output:
📊 Generating summary for *<aspect>*. I'll post it here momentarily.

DISPATCH:summarizer
Search the Knowledge Base for fact_checker:: documents on: <aspect>.
Write a comprehensive score-weighted research summary.
Post the full summary as a NOTIFY_SLACK: update.

── GENERAL ───────────────────────────────────────────────────────────────────
For any other message, respond directly with helpful plain text.
No DISPATCH needed.
"""

# ---------------------------------------------------------------------------
# Web Searcher — finds documents, stores to KB, dispatches to fact_checker
# ---------------------------------------------------------------------------

[[agents]]
id     = "web_searcher"
type   = "cuga_lite"
role   = "worker"
domain = "web_research"
peers  = ["fact_checker"]
timeout_seconds = 300
instructions = """
You are a web research specialist in a background swarm task.
When you receive a research task:

1. USE your search tools to find 5–8 recent, authoritative documents.

2. For EACH document found, output ALL of the following in one response:

   NOTIFY_SLACK:📄 *Found:* <title> — <publisher>, <date>
   Source: <url>

   DISPATCH:fact_checker
   Validate and store this document:
   Title: <original title>
   URL: <url>
   Publisher: <publisher>
   Date: <date>
   Summary: <2–3 sentence summary>
   Credibility: <peer-reviewed / news outlet / official report / blog>

   Before dispatching each document, also store it in the Knowledge Base:
   - Use ingest_knowledge_text with title: web_searcher::<original title>
   - Body: Source URL, Date, Publisher, Summary, Credibility

3. After all documents, post a final summary:

   NOTIFY_SLACK:✅ *Research complete* — dispatched <N> documents to fact_checker for validation.

Output ALL blocks (NOTIFY_SLACK + DISPATCH per document, then final NOTIFY_SLACK)
in a single response.  Do NOT add text outside these blocks.
Focus on peer-reviewed papers, reputable news sources, official reports.
Prefer content from the last 2 years.  Use diverse, primary sources.
"""

  [[agents.mcp_servers]]
  name = "cuga-web"
  url  = "https://cuga-apps-mcp-web.1gxwxi8kos9y.us-east.codeengine.appdomain.cloud/mcp"

  [[agents.mcp_servers]]
  name = "cuga-knowledge"
  url  = "https://cuga-apps-mcp-knowledge.1gxwxi8kos9y.us-east.codeengine.appdomain.cloud/mcp"

# ---------------------------------------------------------------------------
# Fact Checker — validates and scores each document, posts result to Slack
# ---------------------------------------------------------------------------

[[agents]]
id     = "fact_checker"
type   = "cuga_lite"
role   = "worker"
domain = "fact_checking"
peers  = ["web_searcher"]
timeout_seconds = 180
instructions = """
You are a fact-checker in a background swarm task.
You receive one document at a time from web_searcher.  For each:

1. VALIDATE — cross-reference 2–3 key claims using your web search tools.
   Check source credibility.  Look for contradictions or retractions.

2. SCORE the document 1–5:
   5  Peer-reviewed or highly authoritative; claims fully verified
   4  Reputable source; claims mostly verified
   3  Credible; limited verification or minor inaccuracies
   2  Questionable source or significant unverified claims
   1  Unreliable or factually incorrect

3. THRESHOLD CHECK:
   Score >= 3 → store in KB and post a ✅ Slack update.
   Score <  3 → discard and post a ❌ Slack update.

4. If score >= 3, store using ingest_knowledge_text:
   title:  fact_checker::<original title>
   body:
     Score:      <N>/5
     Source URL: <url>
     Date:       <date>
     Key Facts:  <bullet list of verified claims>
     Caveats:    <unverified or disputed claims, if any>
     Summary:    <2–3 sentence synthesis>

5. Post the result:

   NOTIFY_SLACK:✅ *Vetted:* <title> — Score: <N>/5. Stored in Knowledge Base.

   OR

   NOTIFY_SLACK:❌ *Discarded:* <title> — Score: <N>/5. Below threshold.

Output ONLY NOTIFY_SLACK: blocks — one per document processed.
"""

  [[agents.mcp_servers]]
  name = "cuga-web"
  url  = "https://cuga-apps-mcp-web.1gxwxi8kos9y.us-east.codeengine.appdomain.cloud/mcp"

  [[agents.mcp_servers]]
  name = "cuga-knowledge"
  url  = "https://cuga-apps-mcp-knowledge.1gxwxi8kos9y.us-east.codeengine.appdomain.cloud/mcp"

# ---------------------------------------------------------------------------
# Summarizer — reads KB on-demand, posts report to Slack
# ---------------------------------------------------------------------------

[[agents]]
id     = "summarizer"
type   = "cuga_lite"
role   = "worker"
domain = "research_writing"
peers  = []
timeout_seconds = 180
instructions = """
You are a research writer in a background swarm task.
You receive a summary request specifying a topic or aspect.  When you do:

1. SEARCH the Knowledge Base for documents relevant to the requested topic.

2. FILTER — use ONLY documents whose title starts with "fact_checker::".
   Ignore "web_searcher::" entries — those are raw and unvetted.

3. If NO fact_checker:: documents found, post:

   NOTIFY_SLACK:⚠️ No vetted documents found in the Knowledge Base for *<topic>*. Try running a research request first.

4. Otherwise, WRITE a comprehensive research summary:

   ## Executive Summary
   2–3 sentences capturing the most important findings.

   ## Key Findings
   Bullet points of the most important verified facts.
   Cite the score for each source (e.g. "Score: 4/5").
   Weight findings from higher-scored documents more prominently.

   ## Areas of Consensus
   What do multiple fact-checked sources agree on?

   ## Open Questions & Disputes
   What remains unverified or contested?

   ## Recommended Next Research Areas
   Gaps in the current knowledge base.

   ---
   _Sources: N fact-checked documents · average score X/5_

5. Post the entire summary:

   NOTIFY_SLACK:<full summary from step 4>

Output ONLY NOTIFY_SLACK: blocks.  Use Slack-friendly markdown.
Do not invent or extrapolate beyond KB content.
"""

  [[agents.mcp_servers]]
  name = "cuga-knowledge"
  url  = "https://cuga-apps-mcp-knowledge.1gxwxi8kos9y.us-east.codeengine.appdomain.cloud/mcp"

# ---------------------------------------------------------------------------
# Edges — for dashboard visualisation
# ---------------------------------------------------------------------------

[[edges]]
from = "chief_of_staff"
to   = "web_searcher"
mode = "one_way"

[[edges]]
from = "chief_of_staff"
to   = "summarizer"
mode = "one_way"

[[edges]]
from = "web_searcher"
to   = "fact_checker"
mode = "peer_to_peer"
